version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

    # Routine dependency maintenance is limited to compatible minor/patch
    # upgrades. Major upgrades are treated as explicit migrations.
    groups:
      npm-safe-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

    ignore:
      # Core runtime/framework majors require dedicated migration + regression
      # evidence instead of unattended Dependabot PRs.
      - dependency-name: "firebase"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "react-dom"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "lucide-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "motion"
        update-types:
          - "version-update:semver-major"

      # Build/compiler majors can change peer constraints or type semantics.
      - dependency-name: "vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@vitejs/plugin-react"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@tailwindcss/vite"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tailwindcss"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "autoprefixer"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "tsx"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
      - dependency-name: "@types/node"
        update-types:
          - "version-update:semver-major"
