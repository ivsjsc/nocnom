name: Issue 39 npm dependency audit

on:
  push:
    branches:
      - security/npm-audit-39

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply compatible npm audit fixes to lockfile
        run: npm audit fix --package-lock-only || true

      - name: Audit production dependencies after compatible fixes
        run: |
          echo "===== NPM AUDIT PRODUCTION ONLY AFTER FIX ====="
          npm audit --omit=dev --json || true

      - name: Audit all locked dependencies after compatible fixes
        run: |
          echo "===== NPM AUDIT ALL AFTER FIX ====="
          npm audit --json || true

      - name: Commit generated lockfile remediation
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "No package-lock changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "fix(deps): apply compatible npm audit lockfile updates"
          git push
