# Firebase Hosting preview deploy + Firebase security verification
name: Deploy to Firebase Hosting on PR
on: pull_request

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci
      - run: npm run audit:prod
      - run: npm run lint
      - run: npm run firebase:audit
      - run: node --check scripts/deploy-firebase-rules.mjs
      - run: npm test

      - name: Install Firebase rules test tooling
        run: npm install --no-save @firebase/rules-unit-testing@5.0.2 firebase-tools@15.29.0

      - name: Firestore + Storage security rules tests
        run: npx firebase emulators:exec --only firestore,storage "node tests/firebase-rules.test.mjs" --project cocoa-35632

      - run: npm run build

      # Dependabot PRs cannot read repository secrets. Keep all verification
      # gates above, but skip only the Firebase preview deployment for that actor.
      - name: Deploy Firebase Hosting preview
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_COCOA_35632 }}
          projectId: cocoa-35632

      - name: Dependabot preview policy
        if: ${{ github.actor == 'dependabot[bot]' }}
        run: echo "Dependabot verification passed; Firebase preview skipped because repository secrets are intentionally unavailable."
